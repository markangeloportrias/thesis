name: Deploy to Hostinger

on:
  push:
    branches:
      - main

# Allow an upload to finish before another deployment uses the same FTP files.
concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build database configuration from GitHub secret
        env:
          THESIS_DB_PASSWORD: ${{ secrets.THESIS_DB_PASSWORD }}
        run: |
          php <<'PHP'
          <?php
          $password = getenv('THESIS_DB_PASSWORD');
          if ($password === false || $password === '') {
              fwrite(STDERR, "The THESIS_DB_PASSWORD repository secret is required.\n");
              exit(1);
          }
          $config = require 'api/config.php';
          $config['database']['password'] = $password;
          $contents = "<?php\ndeclare(strict_types=1);\n\nreturn " . var_export($config, true) . ";\n";
          if (file_put_contents('api/config.php', $contents) === false) {
              fwrite(STDERR, "Could not write deployment database configuration.\n");
              exit(1);
          }
          PHP
          php -l api/config.php

      - name: Recover interrupted dashboard uploads
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          python3 <<'PY'
          import ftplib
          import os
          import uuid

          # Only recover the known conflicting temporary files; preserve live pages.
          pages = ('student.html', 'instructor.html')
          with ftplib.FTP(timeout=30) as ftp:
              ftp.connect(os.environ['FTP_SERVER'], int(os.environ.get('FTP_PORT') or '21'))
              ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
              ftp.cwd('./')
              for page in pages:
                  temporary = '.in.' + page + '.'
                  backup = '.' + page + '-upload-backup-' + uuid.uuid4().hex + '.tmp'
                  try:
                      ftp.sendcmd('RNFR ' + temporary)
                  except ftplib.error_perm as error:
                      if not str(error).startswith('550'):
                          raise
                      # 550 can mean missing or inaccessible. Let the normal upload
                      # proceed, but do not claim an inaccessible file was repaired.
                      print(temporary + ' absent or inaccessible; proceeding with normal deployment.')
                  else:
                      ftp.voidcmd('RNTO ' + backup)
                      print('Preserved interrupted upload as ' + backup)
          PY

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          server-dir: ./
          # Upload the generated config; exclude repository metadata.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
