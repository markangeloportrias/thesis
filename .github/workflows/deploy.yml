name: Deploy to Hostinger

on:
  push:
    branches:
      - main

# Allow an upload to finish before another deployment uses the same FTP files.
concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build database configuration from GitHub secret
        env:
          THESIS_DB_PASSWORD: ${{ secrets.THESIS_DB_PASSWORD }}
        run: |
          php <<'PHP'
          <?php
          $password = getenv('THESIS_DB_PASSWORD');
          if ($password === false || $password === '') {
              fwrite(STDERR, "The THESIS_DB_PASSWORD repository secret is required.\n");
              exit(1);
          }
          $config = require 'api/config.php';
          $config['database']['password'] = $password;
          $contents = "<?php\ndeclare(strict_types=1);\n\nreturn " . var_export($config, true) . ";\n";
          if (file_put_contents('api/config.php', $contents) === false) {
              fwrite(STDERR, "Could not write deployment database configuration.\n");
              exit(1);
          }
          PHP
          php -l api/config.php

      - name: Recover interrupted deployment uploads
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          python3 <<'PY'
          import ftplib
          import os
          from pathlib import Path, PurePosixPath
          import subprocess
          import uuid

          # Only consider temporary counterparts of deployed repository files.
          # Match the FTP action's exclusions and preserve all live files.
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8').split('\0')
          files = []
          for filename in tracked:
              path = PurePosixPath(filename)
              if not filename or any(part.startswith('.git') or part == 'node_modules' for part in path.parts):
                  continue
              if path.is_absolute() or '..' in path.parts or '\r' in filename or '\n' in filename:
                  raise ValueError('Unsupported deployment path')
              if Path(filename).is_file():
                  files.append(path)
          files.append(PurePosixPath('.ftp-deploy-sync-state.json'))
          recovered = 0
          unavailable = 0
          with ftplib.FTP(timeout=30) as ftp:
              ftp.connect(os.environ['FTP_SERVER'], int(os.environ.get('FTP_PORT') or '21'))
              ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
              ftp.cwd('./')
              for path in files:
                  # The .in. prefix belongs to the basename, not its directory.
                  temporary = str(path.with_name('.in.' + path.name + '.'))
                  backup = str(path.with_name('.upload-backup-' + uuid.uuid4().hex + '.tmp'))
                  try:
                      ftp.sendcmd('RNFR ' + temporary)
                  except ftplib.error_perm as error:
                      if not str(error).startswith('550'):
                          raise
                      # 550 can mean missing or inaccessible. Let the normal upload
                      # proceed, but do not claim an inaccessible file was repaired.
                      unavailable += 1
                  else:
                      ftp.voidcmd('RNTO ' + backup)
                      recovered += 1
                      print('Preserved ' + temporary + ' as ' + backup)
          print(f'Recovered {recovered} temporary uploads; {unavailable} absent or inaccessible. Normal deployment follows.')
          PY

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          server-dir: ./
          # Upload the generated config; exclude repository metadata.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
